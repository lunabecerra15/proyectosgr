<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Pedidos - Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zapacciano (Mozo)</a>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <!-- Contenido de la Página -->
    <div class="container mt-4">
        
        <!-- Fila de Mensajes de Alerta (Éxito o Error) -->
        <div class="row">
            <div class="col-12">
                <!-- Mensaje de Éxito (para Pedido Creado o Cobrado) -->
                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <strong th:text="${mensajeExito}"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <!-- Mensaje de Error -->
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <strong th:text="${mensajeError}"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </div>

        <!-- Sistema de 2 Columnas -->
        <div class="row g-4">

            <!-- ============================================= -->
            <!-- COLUMNA IZQUIERDA: Formulario de Nuevo Pedido -->
            <!-- ============================================= -->
            <div class="col-md-7">
                <!-- El <form> principal que envía a @PostMapping("/pedidos") -->
                <form th:action="@{/pedidos}" method="post" class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="mb-0">Registrar Nuevo Pedido</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Campo 1: Número de Mesa (¡Ahora es un Dropdown!) -->
                        <div class="mb-3">
                            <label for="mesa" class="form-label">Número de Mesa:</label>
                            <select class="form-select" id="mesa" name="mesa" required>
                                <option value="" selected disabled>-- Seleccione una Mesa --</option>
                                <th:block th:each="m : ${mesasDisponibles}">
                                    <option th:value="${m.numero}" 
                                            th:text="|Mesa N° ${m.numero} (Capacidad: ${m.capacidad})|">
                                    </option>
                                </th:block>
                            </select>
                        </div>

                        <hr>

                        <!-- Campo 2: Items del Pedido (Dinámico) -->
                        <h5 class="mb-3">Pedido</h5>
                        <div id="items-container">
                            <!-- Fila de plantilla para clonar con JS -->
                            <div class="row g-2 mb-2 item-row">
                                <div class="col-6">
                                    <select class="form-select" name="productoId" required>
                                        <option value="" selected disabled>-- Seleccione un Producto --</option>
                                        <th:block th:each="p : ${productosDisponibles}">
                                            <option th:value="${p.id}" 
                                                    th:text="|${p.nombre} ($${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')})|">
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                                <div class="col-3">
                                    <input type="number" class="form-control" name="cantidad" value="1" min="1" required>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-sm btn-danger w-100 remove-item-btn">
                                        <i class="bi bi-trash"></i> Quitar
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="button" id="add-item-btn" class="btn btn-outline-primary mt-2">
                            <i class="bi bi-plus-lg"></i> Agregar Producto
                        </button>
                    </div>
                    
                    <div class="card-footer text-end">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-plus-circle"></i> Enviar Pedido
                        </button>
                    </div>
                </form>
            </div>

            <!-- ============================================= -->
            <!-- COLUMNA DERECHA: ¡¡NUEVO CONTENEDOR!!         -->
            <!-- ============================================= -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <!-- --- ¡¡LÍNEA DE ARREGLO!! (Cambiamos #authentication.name por ${nombreMozo}) --- -->
                        <h5 class="mb-0">Pedidos en Curso (de <span th:text="${nombreMozo}">Mozo</span>)</h5>
                    </div>
                    <div class="card-body">
                        
                        <!-- Caso 1: Si NO hay pedidos activos -->
                        <div th:if="${#lists.isEmpty(pedidosActivos)}">
                            <p class="text-muted text-center">No tienes pedidos pendientes.</p>
                        </div>

                        <!-- Caso 2: Si SÍ hay pedidos, los iteramos -->
                        <div th:unless="${#lists.isEmpty(pedidosActivos)}" class="list-group">
                            
                            <div th:each="pedido : ${pedidosActivos}" class="list-group-item list-group-item-action">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1" th:text="|Mesa N° ${pedido.mesa.numero}|">Mesa N° 5</h6>
                                    <small th:text="${#temporals.format(pedido.fecha, 'HH:mm')} + ' hs'">14:30 hs</small>
                                </div>
                                
                                <ul class="list-unstyled mb-2 mt-1 small">
                                    <li th:each="item : ${pedido.items}" 
                                        th:text="|${item.cantidad}x ${item.producto.nombre}|">
                                    </li>
                                </ul>
                                
                                <div class="d-flex justify-content-between align-items.center">
                                    <strong th:text="|Total: $${#numbers.formatDecimal(pedido.total, 0, 'POINT', 0, 'COMMA')}|">
                                        Total: $16.000
                                    </strong>
                                    
                                    <form th:action="@{/pedidos/cobrar/{id}(id=${pedido.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-primary">
                                            <i class="bi bi-cash-coin"></i> Cobrar
                                        </button>
                                    </form>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
            
        </div> <!-- Fin de .row -->
    </div> <!-- Fin de .container -->

    <!-- Script de JavaScript para agregar/quitar items (sigue igual) -->
    <!-- (¡OJO! Tuve que corregir un bug en el script que te pasé antes) -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        // Pasamos los productos de Thymeleaf a JavaScript
        const productosDisponibles = /*[[${productosDisponibles}]]*/ [];
        
        // --- ¡NUEVO! Creamos el HTML del dropdown dinámicamente ---
        let optionsHtml = '<option value="" selected disabled>-- Seleccione un Producto --</option>';
        productosDisponibles.forEach(p => {
            let precioFormateado = new Intl.NumberFormat('es-AR', { style: 'decimal' }).format(p.precio);
            optionsHtml += `<option value="${p.id}">${p.nombre} ($${precioFormateado})</option>`;
        });
    
        document.addEventListener("DOMContentLoaded", function() {
            
            const addItemButton = document.getElementById("add-item-btn");
            const itemsContainer = document.getElementById("items-container");
            const itemTemplateRow = document.querySelector(".item-row");

            // Aplicamos las opciones al primer dropdown (la plantilla)
            if (itemTemplateRow) {
                itemTemplateRow.querySelector("select[name='productoId']").innerHTML = optionsHtml;
            }

            function addNewItem() {
                const newItemRow = itemTemplateRow.cloneNode(true);
                
                // Limpiamos los valores del clon
                newItemRow.querySelector("select").selectedIndex = 0;
                newItemRow.querySelector("input").value = "1";
                
                itemsContainer.appendChild(newItemRow);
            }

            function removeItem(event) {
                const rowToRemove = event.target.closest(".item-row");
                const totalRows = itemsContainer.querySelectorAll(".item-row").length;
                
                if (totalRows > 1) {
                    rowToRemove.remove();
                } else {
                    console.warn("No se puede eliminar el último item.");
                }
            }

            addItemButton.addEventListener("click", addNewItem);

            itemsContainer.addEventListener("click", function(event) {
                if (event.target && event.target.closest(".remove-item-btn")) {
                    removeItem(event);
                }
            });
        });
        /*]]>*/
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
