<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Pedidos - Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Estilos para que parezca una App Táctil */
        body { overflow: hidden; /* Evita doble scroll */ }
        .producto-card { 
            cursor: pointer; 
            transition: all 0.2s; 
            border: 1px solid #dee2e6;
        }
        .producto-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-color: #0d6efd; 
        }
        .producto-card:active {
            transform: scale(0.98);
        }
        .card-img-top { 
            height: 120px; 
            object-fit: cover; /* Ajusta la imagen sin deformarla */
            background-color: #eee;
        }
        .scroll-area { 
            height: calc(100vh - 70px); 
            overflow-y: auto; 
        }
        .ticket-panel {
            background-color: #f8f9fa;
            border-left: 1px solid #ddd;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }
        .categoria-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zapacciano (Mozo)</a>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>


    <div class="container-fluid">
        <div class="row">
            
            <div class="col-md-7 p-3 scroll-area bg-light">
                
                <h5 class="mb-3 text-secondary"><i class="bi bi-grid-fill"></i> Seleccionar Productos</h5>

                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
                    <div class="col" th:each="p : ${productosDisponibles}">
                        <div class="card producto-card h-100" 
                             th:onclick="agregarAlCarrito([[${p.id}]], [[${p.nombre}]], [[${p.precio}]])">
                            
                            <span class="badge bg-dark categoria-badge" th:text="${p.categoria}">Cat</span>

                            <img th:src="${p.imagenUrl != null && !#strings.isEmpty(p.imagenUrl) ? p.imagenUrl : 'https://placehold.co/400x300/e9ecef/495057?text=' + p.nombre}" 
                                 class="card-img-top" alt="Foto Plato"
                                 style="height: 120px; width: 100%; object-fit: cover;">
                            
                            <div class="card-body p-2 text-center">
                                <h6 class="card-title mb-1 text-truncate" th:text="${p.nombre}">Nombre</h6>
                                <p class="card-text fw-bold text-primary mb-0" 
                                   th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')}"></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div style="height: 100px;"></div> </div>

            <div class="col-md-5 p-0 scroll-area">
                <div class="ticket-panel p-3">
                    
                    <h5 class="border-bottom pb-2"><i class="bi bi-receipt"></i> Nuevo Pedido</h5>

                    <form th:action="@{/pedidos}" method="post" id="formPedido" class="d-flex flex-column h-100">
                        
                        <div class="mb-3">

                            
                            <label class="form-label fw-bold small text-muted">SELECCIONAR MESA</label>
                            <select class="form-select form-select-md border-primary" name="mesa" required>
                                <option value="" selected disabled>-- Elegir Mesa --</option>
                                <th:block th:each="m : ${mesasDisponibles}">
                                    <option th:value="${m.numero}" th:text="|Mesa ${m.numero} (${m.capacidad}p)|"></option>
                                </th:block>
                            </select>
                        </div>

                        <div class="flex-grow-1 bg-white border rounded p-2 mb-3 shadow-sm" style="overflow-y: auto;">
                            <div id="empty-msg" class="text-center text-muted mt-5">
                                <i class="bi bi-basket display-4"></i>
                                <p class="mt-2">El pedido está vacío</p>
                            </div>
                            <table class="table table-sm table-borderless align-middle mb-0">
                                <tbody id="carrito-body">
                                    </tbody>
                            </table>
                        </div>

                         <div class="d-flex justify-content-between align-items-end mb-3 px-2">
                            <span class="text-muted">Total Estimado:</span>
                            <span class="h5 mb-0 fw-bold text-dark" id="total-texto">$0</span>
                        </div>

                        <div id="inputs-ocultos"></div>
                        <div class="card-footer text-end">
                        <button type="submit" class="btn btn-success btn-md">
                            <i class="bi bi-plus-circle"></i> Enviar Pedido
                        </button>
                    </div>
                       
                    </form>

                    <div class="mt-2 pt-1 border-top">
                        <small class="text-muted fw-bold">PEDIDOS ACTIVOS:</small>
                        <div class="d-flex flex-wrap gap-1 mt-1">
                            <span th:if="${#lists.isEmpty(pedidosActivos)}" class="text-muted small">Sin pedidos activos.</span>
                            
                            <div th:each="pa : ${pedidosActivos}" class="btn-group btn-group-md">
                                <span class="btn btn-secondary disabled opacity-75" th:text="|Mesa ${pa.mesa.numero}|"> Mesa 5 </span>
                                <form th:action="@{/pedidos/cobrar/{id}(id=${pa.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-primary">
                                            <i class="bi bi-cash-coin"></i> Cobrar

                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Memoria del carrito: { idProducto: {nombre, precio, cantidad} }
        let carrito = {};

        function agregarAlCarrito(id, nombre, precio) {
            if (carrito[id]) {
                carrito[id].cantidad++;
            } else {
                carrito[id] = { id, nombre, precio, cantidad: 1 };
            }
            renderizarCarrito();
        }

        function restarDelCarrito(id) {
            if (carrito[id]) {
                carrito[id].cantidad--;
                if (carrito[id].cantidad <= 0) delete carrito[id];
            }
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById('carrito-body');
            const emptyMsg = document.getElementById('empty-msg');
            const totalTexto = document.getElementById('total-texto');
            const inputsContainer = document.getElementById('inputs-ocultos');

            tbody.innerHTML = '';
            inputsContainer.innerHTML = '';
            
            let total = 0;
            let hayItems = false;

            for (let id in carrito) {
                hayItems = true;
                let item = carrito[id];
                let subtotal = item.precio * item.cantidad;
                total += subtotal;

                // 1. Dibujar fila visual
                let fila = `
                    <tr class="border-bottom">
                        <td>
                            <div class="fw-bold text-dark">${item.nombre}</div>
                            <div class="small text-muted">$${item.precio}</div>
                        </td>
                        <td class="text-end" style="width: 110px;">
                            <div class="input-group input-group-sm">
                                <button class="btn btn-outline-secondary" type="button" onclick="restarDelCarrito(${id})">-</button>
                                <span class="input-group-text bg-white" style="width: 35px; justify-content: center;">${item.cantidad}</span>
                                <button class="btn btn-outline-primary" type="button" onclick="agregarAlCarrito(${id}, '${item.nombre}', ${item.precio})">+</button>
                            </div>
                        </td>
                        <td class="text-end fw-bold">$${subtotal}</td>
                    </tr>
                `;
                tbody.innerHTML += fila;

                // 2. Crear inputs ocultos para Spring Boot
                // Spring espera: productoId=1, productoId=2 y cantidad=1, cantidad=5
                let inputId = document.createElement('input');
                inputId.type = 'hidden';
                inputId.name = 'productoId';
                inputId.value = id;

                let inputCant = document.createElement('input');
                inputCant.type = 'hidden';
                inputCant.name = 'cantidad';
                inputCant.value = item.cantidad;

                inputsContainer.appendChild(inputId);
                inputsContainer.appendChild(inputCant);
            }

            // Mostrar u ocultar mensaje vacío
            emptyMsg.style.display = hayItems ? 'none' : 'block';
            
            // Formato de moneda Argentina
            totalTexto.innerText = '$' + new Intl.NumberFormat('es-AR').format(total);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
