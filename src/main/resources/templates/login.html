<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Zapacciano</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 
      PASO 1: ¡LA MAGIA DE BOOTSTRAP! 
      Esta línea "importa" todo el kit de diseño. 
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
</head>
<body class="bg-light"> <!-- Un fondo gris claro para que resalte -->

    <!-- Contenedor principal -->
    <div class="container">
        <div class="row justify-content-center">
            <!-- Hacemos la columna más angosta y centrada -->
            <div class="col-lg-5 col-md-7 col-sm-10">
                
                <!-- "Card" es una caja con sombra y bordes redondeados -->
                <div class="card shadow-lg border-0 rounded-3 my-5">
                    <div class="card-body p-4 p-sm-5">
                        
                        <h2 class="card-title text-center mb-5 fw-bold">Login Zapacciano</h2>

                        <!-- 
                          MANEJO DE ERRORES CON BOOTSTRAP
                          Estos 'div' solo aparecen si hay un error o un logout.
                        -->
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            Email o Contraseña incorrectos.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            Has cerrado sesión exitosamente.
                        </div>

                        <!-- 
                          TU MISMO FORMULARIO, pero con clases de Bootstrap 
                        -->
                        <form th:action="@{/login}" method="post">
                            
                            <!-- "mb-3" significa "margin-bottom 3" (agrega espacio abajo) -->
                            <div class="mb-3">
                                <!-- "form-label" le da estilo a la etiqueta -->
                                <label for="username" class="form-label">Email:</label>
                                <!-- "form-control" hace que el input ocupe el 100% y se vea bien -->
                                <input type="text" id="username" name="username" class="form-control" required autofocus/>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password:</label>
                                <input type="password" id="password" name="password" class="form-control" required/>
                            </div>
                            
                            <!-- "d-grid" hace que el botón ocupe todo el ancho -->
                            <div class="d-grid">
                                <!-- "btn btn-primary" es el botón azul bonito -->
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Ingresar</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 
      (Opcional pero recomendado) 
      El Javascript de Bootstrap para cosas más avanzadas 
    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
</body>
</html>
