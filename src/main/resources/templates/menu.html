<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuestro Menú - Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #800000 !important; /* Fondo Bordó */
            color: white; 
            font-family: 'Inter', sans-serif;
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }
        
        .display-4 { color: white; }
        
        .lead { color: rgba(255, 255, 255, 0.8); }
        
        /* TARJETAS DEL MENÚ */
        .card {
            background-color: transparent !important; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white;
            overflow: hidden; /* Para que la imagen respete los bordes redondeados */
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        /* Efecto al pasar el mouse (opcional, queda lindo) */
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.8);
        }
        
        .card-title {
            font-weight: 700; 
            color: white !important;
        }
        
        .card-text {
            color: rgba(255, 255, 255, 0.8) !important; 
        }
        
        .badge.bg-dark {
            font-size: 1rem; 
            font-weight: 700;
            background-color: #000000 !important; /* Negro puro para resaltar */
            border: 1px solid white;
        }

        /* ESTILO PARA LA IMAGEN */
        .card-img-top {
            height: 200px; /* Altura fija para que todas se vean iguales */
            width: 100%;
            object-fit: cover; /* Recorta la imagen para llenar el espacio sin deformar */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="/">Zapacciano</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/}">Inicio</a>
                <a class="nav-link active" th:href="@{/menu}">Menú</a>
                <a class="nav-link" th:href="@{/reservas}">Reservas</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        
        <div class="text-center mb-5">
            <h1 class="display-4">Nuestro Menú</h1>
            <p class="lead">Platos y bebidas preparados con los mejores ingredientes.</p>
        </div>

        <div th:each="categoriaEntry : ${menuAgrupado}">
            
            <h2 class="h3 border-bottom border-light border-opacity-50 pb-2 mb-4 mt-5" 
                th:text="${categoriaEntry.key}">
                Categoría
            </h2>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div th:each="producto : ${categoriaEntry.value}" class="col">
                    
                    <div class="card h-100 shadow-sm">
                        
                        <img th:src="${producto.imagenUrl != null && !#strings.isEmpty(producto.imagenUrl) ? producto.imagenUrl : 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=60'}" 
                             class="card-img-top" 
                             alt="Foto del plato">
                        
                        <div class="card-body d-flex flex-column">
                            
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title mb-0" th:text="${producto.nombre}">
                                    Pizza Mozzarella
                                </h5>
                                
                                <span class="badge bg-dark" 
                                      th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA')}">
                                    $14,000
                                </span>
                            </div>
                            
                            <p class="card-text flex-grow-1" th:text="${producto.descripcion}">
                                Descripción del plato.
                            </p>

                        </div>
                    </div>

                </div>
            </div>
        </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
