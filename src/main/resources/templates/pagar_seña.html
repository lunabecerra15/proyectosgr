<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmar Pago de Seña - Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h3 class="mb-0">Confirmar Pago de Seña</h3>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">¡Gracias por tu reserva, <span th:text="${reserva.cliente.nombre}">Cliente</span>!</h5>
                        <p>Estás a un paso de confirmar tu mesa.</p>
                        
                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item">
                                <strong>Fecha y Hora:</strong>
                                <span th:text="${#temporals.format(reserva.fechaHora, 'dd/MM/yyyy ''a las'' HH:mm')} + ' hs'"></span>
                            </li>
                            <li class="list-group-item">
                                <strong>Personas:</strong>
                                <span th:text="${reserva.cantidadPersonas}"></span>
                            </li>
                            
                            <!-- ¡NUEVOS CAMPOS PARA MOSTRAR EL CÁLCULO! -->
                            <li class="list-group-item text-muted">
                                <strong>Seña por persona:</strong>
                                <span>$10.000,00 ARS</span>
                            </li>
                            <li class="list-group-item list-group-item-success fs-5">
                                <strong>MONTO TOTAL A PAGAR:</strong>
                                <!-- Muestra el montoSeña que calculamos en el service -->
                                <strong th:text="${'$' + #numbers.formatDecimal(reserva.montoSeña, 1, 'POINT', 2, 'COMMA') + ' ARS'}"></strong>
                            </li>
                            <!-- FIN DE NUEVOS CAMPOS -->

                        </ul>

                        <p class="text-muted small">
                            Esto es una simulación de pago. La seña se descontará de tu cuenta final en el restaurante.
                        </p>
                        
                        <!-- El formulario que simula el pago -->
                        <form th:action="@{/reservas/pagar/{id}(id=${reserva.id})}" method="post">
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    Confirmar Pago Simulado
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
