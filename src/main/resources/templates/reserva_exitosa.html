<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Reserva Confirmada!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Agregamos los iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- 1. Importamos las fuentes 'Playfair' (títulos) y 'Inter' (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- 2. Estilos Bordó/Blanco para la página de éxito -->
    <style>
        body {
            background-color: #800000 !important; /* Fondo Bordó */
            color: white;
            font-family: 'Inter', sans-serif;
        }

        /* 3. Título (Playfair) */
        h1, .lead {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }
        
        /* 4. Ícono de éxito (en lugar de texto verde) */
        .success-icon {
            font-size: 5rem; /* Ícono bien grande */
            color: white;
            margin-bottom: 1.5rem;
        }

        /* 5. Tarjeta (Gris Oscuro) */
        .card {
            background-color: #b03838; /* Gris oscuro, casi negro */
            border: 2px solid white; /* Borde blanco, más grueso */
            color: white;
        }
        
        /* 6. Botón Principal (Blanco Sólido) */
        .btn-light {
            color: #800000; /* Texto bordó */
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .btn-light:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<!-- CAMBIO 1: Quitamos 'bg-light' del body -->
<body>

    <!-- CAMBIO 2: Agregamos la Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="/">Zapacciano</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/}">Inicio</a>
                <a class="nav-link" th:href="@{/menu}">Menú</a>
                <a class="nav-link active" th:href="@{/reservas}">Reservas</a>
            </div>
        </div>
    </nav>

    <div class="container text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- CAMBIO 3: Quitamos 'shadow-lg' y 'border-success' -->
                <div class="card border-light">
                    <div class="card-body p-5">
                        
                        <!-- CAMBIO 4: Agregamos un ícono de éxito -->
                        <i class="bi bi-check-circle-fill success-icon"></i>

                        <!-- CAMBIO 5: Quitamos 'text-success' del h1 -->
                        <h1 class="display-4 text-light">¡Éxito!</h1>
                        <p class="lead">Tu reserva ha sido confirmada.</p>
                        <p>¡Te esperamos en Zapacciano!</p>
                        
                        <!-- CAMBIO 6: Botón 'btn-primary' a 'btn-light' -->
                        <a href="/" class="btn btn-light mt-4">Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
