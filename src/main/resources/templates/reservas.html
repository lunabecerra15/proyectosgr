<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hacer una Reserva - Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row">
            <div class="col-md-8 col-lg-6 mx-auto">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4">Hacer una Reserva</h2>
                        
                        <!-- Mensaje de Error (si lo hay) -->
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <strong th:text="${error}"></strong>
                        </div>

                        <!-- 
                          ¡ESTE ES EL FORMULARIO CLAVE!
                          Apunta a POST /reservas
                        -->
                        <form th:action="@{/reservas}" method="post">
                            
                            <!-- 1. Nombre -->
                            <div class="mb-3">
                                <label for="nombreCliente" class="form-label">Nombre Completo:</label>
                                <!-- ¡AQUÍ! name="nombreCliente" -->
                                <input type="text" class="form-control" id="nombreCliente" name="nombreCliente" placeholder="Ej: Juan Pérez" required>
                            </div>
                            
                            <!-- 2. Teléfono -->
                            <div class="mb-3">
                                <label for="telefonoCliente" class="form-label">Teléfono:</label>
                                <!-- ¡AQUÍ! name="telefonoCliente" -->
                                <input type="tel" class="form-control" id="telefonoCliente" name="telefonoCliente" placeholder="Ej: 1122334455" required>
                            </div>

                            <!-- 3. Email -->
                            <div class="mb-3">
                                <label for="emailCliente" class="form-label">Email:</label>
                                <!-- ¡AQUÍ! name="emailCliente" -->
                                <input type="email" class="form-control" id="emailCliente" name="emailCliente" placeholder="Ej: juan.perez@correo.com" required>
                            </div>

                            <!-- 4. Fecha y Hora -->
                            <div class="mb-3">
                                <label for="fechaHora" class="form-label">Fecha y Hora de la Reserva:</label>
                                <!-- ¡AQUÍ! name="fechaHora" -->
                                <input type="datetime-local" class="form-control" id="fechaHora" name="fechaHora" required>
                            </div>

                            <!-- 5. Cantidad de Personas -->
                            <div class="mb-3">
                                <label for="cantidadPersonas" class="form-label">Cantidad de Personas:</label>
                                <!-- ¡AQUÍ! name="cantidadPersonas" -->
                                <input type="number" class="form-control" id="cantidadPersonas" name="cantidadPersonas" min="1" max="12" placeholder="Ej: 4" required>
                            </div>

                            <hr class="my-4">
                            
                            <p class="text-muted small">
                                Se requerirá el pago de una seña de <strong>$10.000,00 por persona</strong> 
                                para confirmar la reserva. Este monto se descontará del total de su cuenta.
                            </p>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Continuar al Pago de la Seña
                                </button>
                            </div>
                            
                            <div class="text-center mt-3">
                                <a th:href="@{/}" class="btn btn-link">Volver al Inicio</a>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
