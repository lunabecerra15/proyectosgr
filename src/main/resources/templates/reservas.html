<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hacer una Reserva - Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- 1. Importamos las fuentes 'Playfair' (títulos) y 'Inter' (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 2. Agregamos los estilos "Gourmet" para el formulario -->
    <style>
        body {
            background-color: #800000 !important; /* Fondo Bordó */
            color: white;
            font-family: 'Inter', sans-serif;
        }

        /* 3. El título "Hacer una Reserva" */
        h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #ffffff; 
        }
        
        /* 4. La "tarjeta" que contiene el formulario */
        .card {
            background-color: #b03838; /* Gris oscuro, casi negro */
            border: 1px solid #d29898; /* Borde sutil */
            color: white;
        }
        
        /* 5. ¡Estilo clave! Los inputs del formulario */
        .form-control {
            background-color: #8d4e4e; /* Fondo del input */
            border-color: #800000; /* Borde del input */
            color: white; /* Texto que escribe el usuario */
        }
        .form-control::placeholder {
            color: #f1dddd; /* Placeholder más claro */
        }
        .form-control:focus {
            background-color: #4a4a4a;
            border-color: #e1dac3; 
            box-shadow: 0 0 0 .25rem rgba(212, 175, 55, .25); 
            color: white;
        }
        
        /* Arreglo para el ícono del calendario en el input de fecha */
        input[type="datetime-local"] {
            color-scheme: dark;
        }

        /* 6. El botón principal de "Continuar" */
        .btn-primary {
            background-color: #800000; 
            border-color: #fcf5df;
            color: #ffffff; 
            font-weight: 700;
            text-transform: uppercase; /* Letras mayúsculas */
        }
        .btn-primary:hover {
            background-color: #ffcfcf; 
            border-color: #ffffff;
        }
        
        /* 7. El link de "Volver" */
        .btn-link {
            color: white;
            text-decoration: none;
        }
        .btn-link:hover {
            text-decoration: underline;
        }
        
        /* 8. Texto de ayuda (como el de la seña) */
        .text-muted {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        /* 9. ¡NUEVO! Estilo para la alerta de error */
        /* (Fondo blanco, texto bordó para que resalte) */
        .alert-custom-error {
            background-color: white;
            color: #721c24; /* Rojo/bordó oscuro */
            border: 2px solid #721c24;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="/">Zapacciano</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/}">Inicio</a>
                <a class="nav-link" th:href="@{/menu}">Menú</a>
                <a class="nav-link active" th:href="@{/reservas}">Reservas</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-8 col-lg-6 mx-auto">
                <div class="card">
                    <div class="card-body p-4 p-md-5">
                        
                        <h2 class="text-center mb-4">Hacer una Reserva</h2>
                        
                        <!-- 
                        ====================================================================
                        ¡¡¡AQUÍ ESTÁ LA CORRECCIÓN!!! 
                        Este div 'th:if' escucha el error que manda el Controller
                        y lo muestra en una alerta.
                        ====================================================================
                        -->
                        <div th:if="${error}" class="alert alert-custom-error" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <strong>Error: </strong>
                            <span th:text="${error}"></span>
                        </div>

                        <!-- El formulario ahora está DEBAJO de la alerta -->
                        <form th:action="@{/reservas}" method="post">
                            
                            <!-- 1. Nombre -->
                            <div class="mb-3">
                                <label for="nombreCliente" class="form-label">Nombre Completo:</label>
                                <input type="text" class="form-control" id="nombreCliente" name="nombreCliente" placeholder="Ej: Juan Pérez" required>
                            </div>
                            
                            <!-- 2. Teléfono -->
                            <div class="mb-3">
                                <label for="telefonoCliente" class="form-label">Teléfono:</label>
                                <input type="tel" class="form-control" id="telefonoCliente" name="telefonoCliente" placeholder="Ej: 1122334455" required>
                            </div>

                            <!-- 3. Email -->
                            <div class="mb-3">
                                <label for="emailCliente" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="emailCliente" name="emailCliente" placeholder="Ej: juan.perez@correo.com" required>
                            </div>

                            <!-- 4. Fecha y Cantidad (divididos en fila) -->
                            <div class="row mb-3">
                                <div class="col-md-7">
                                    <label for="fechaHoraInput" class="form-label">Fecha y Hora:</label>
                                    <input type="datetime-local" class="form-control" id="fechaHoraInput" name="fechaHora" required>
                                    <small class="form-text text-muted">
                                        Horario: 12:00 a 22:00 hs.
                                    </small>
                                </div>
                                <div class="col-md-5">
                                    <label for="cantidadPersonas" class="form-label">Personas:</label>
                                    <input type="number" class="form-control" id="cantidadPersonas" name="cantidadPersonas" min="1" required>
                                </div>
                            </div>


                            <hr class="my-4">
                            
                            <p class="text-muted small">
                                Se requerirá el pago de una seña de <strong>$10.000,00 por persona</strong> 
                                para confirmar la reserva.
                            </p>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Continuar al Pago de la Seña
                                </button>
                            </div>
                            
                            <div class="text-center mt-3">
                                <a th:href="@{/}" class="btn btn-link">Volver al Inicio</a>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- El script de JS se mantiene intacto -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var fechaInput = document.getElementById("fechaHoraInput");
            var now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            
            var yyyy = now.getFullYear();
            var mm = String(now.getMonth() + 1).padStart(2, '0');
            var dd = String(now.getDate()).padStart(2, '0');
            var hh = String(now.getHours()).padStart(2, '0');
            var min = String(now.getMinutes()).padStart(2, '0');
            
            var fechaMinima = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
            
            fechaInput.min = fechaMinima;
        });
    </script>

</body>
</html>
