<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Productos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación (Copiada de home.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zapacciano (Admin)</a>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <!-- Contenido de la Página -->
    <div class="container mt-4">

        <!-- Fila 1: Título y Botón de Volver -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Gestionar Precios de Productos</h1>
            <a th:href="@{/home}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>
        
        <!-- Mensaje de Éxito (si venimos de un update) -->
        <div th:if="${exito}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            ¡Precio actualizado correctamente!
        </div>

        <!-- Fila 2: La Tabla de Productos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre del Producto</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th style="width: 200px;">Precio (ARS)</th>
                                <th style="width: 150px;">Acción</th>
                            </tr>
                        </thead>
                            <tbody>
                                <tr th:each="prod : ${productos}">
                                    <td th:text="${prod.id}">1</td>
                                    <td th:text="${prod.nombre}">Pizza Margarita</td>
                                    <td th:text="${prod.categoria}">Pizzas</td>
                                    <td th:text="${prod.stock}">100</td>
                                
                                    <td>
                                        <form th:action="@{/admin/productos/editar}" method="post" class="d-flex gap-2">
                                        
                                            <input type="hidden" name="productoId" th:value="${prod.id}">
                                        
                                            <input type="number" 
                                            name="precio" 
                                            th:value="${prod.precio}" 
                                            step="0.01" 
                                            class="form-control form-control-sm" 
                                            placeholder="Precio" 
                                            required>
                                        
                                            <button type="submit" class="btn btn-success btn-sm" title="Guardar cambios">
                                                <i class="bi bi-check-lg"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
