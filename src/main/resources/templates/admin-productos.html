<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Productos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zapacciano (Admin)</a>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Gestionar Productos</h1>
            
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
                    <i class="bi bi-plus-lg"></i> Nuevo Producto
                </button>

                <a th:href="@{/home}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>
        </div>
        
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <strong th:text="${exito}"></strong> 
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th style="width: 220px;">Precio (ARS)</th>
                            </tr>
                        </thead>
                            <tbody>
                                <tr th:each="prod : ${productos}">
                                    <td th:text="${prod.id}">1</td>
                                    <td>
                                        <span th:text="${prod.nombre}" class="fw-bold"></span>
                                        <i th:if="${prod.imagenUrl != null && !#strings.isEmpty(prod.imagenUrl)}" 
                                           class="bi bi-image text-muted ms-1" title="Tiene imagen"></i>
                                    </td>
                                    <td><span class="badge bg-secondary" th:text="${prod.categoria}">Cat</span></td>
                                    <td th:text="${prod.stock}">100</td>
                                
                                    <td>
                                        <form th:action="@{/admin/productos/editar}" method="post" class="d-flex gap-2">
                                            <input type="hidden" name="productoId" th:value="${prod.id}">
                                            
                                            <input type="number" name="precio" th:value="${prod.precio}" step="0.01" 
                                                   class="form-control form-control-sm" required>
                                            
                                            <button type="submit" class="btn btn-success btn-sm" title="Guardar Precio">
                                                <i class="bi bi-check-lg"></i> Guardar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div> 

    <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Agregar Nuevo Plato/Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form th:action="@{/admin/productos/crear}" method="post">
                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Milanesa Napolitana" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="2" placeholder="Ingredientes o detalles..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Precio ($)</label>
                                <input type="number" step="0.01" name="precio" class="form-control" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Stock Inicial</label>
                                <input type="number" name="stock" class="form-control" value="100" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Categoría</label>
                            <select name="categoria" class="form-select" required>
                                <option value="" selected disabled>-- Seleccionar --</option>
                                <option value="Entrada">Entrada</option>
                                <option value="Plato Principal">Plato Principal</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Postre">Postre</option>
                                <option value="Cafetería">Cafetería</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL de Imagen (Opcional)</label>
                            <input type="text" name="imagenUrl" class="form-control" placeholder="https://...">
                            <div class="form-text text-muted">
                                Busca una imagen en Google, clic derecho "Copiar dirección de imagen" y pégala aquí.
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
