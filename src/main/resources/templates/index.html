<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restaurante Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- 
      ¡AQUÍ IMPORTAMOS LAS FUENTES! 
      Traemos "Playfair Display" (negrita 700) y "Inter" (normal 400 y negrita 700).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
        }

        body {
            background-color: #800000 !important; 
            color: white; 
            
            font-family: 'Inter', sans-serif;
        }

        .cover-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 90%;
            text-align: center;
        }
        
        .display-4 {
            font-family: 'Playfair Display', serif;
            font-weight: 700; /* Forzamos la negrita que importamos */
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 700; /* Letra más gruesa en botones */
        }

        .btn-outline-light {
             border-width: 2px;
        }
        .btn-outline-light:hover {
            background-color: white;
            color: #800000;
        }
        .btn-light {
            color: #800000;
        }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="/">Zapacciano</a>
            <div class="navbar-nav">
                <a class="nav-link active" th:href="@{/}">Inicio</a>
                <a class="nav-link" th:href="@{/menu}">Menú</a>
                <a class="nav-link" th:href="@{/reservas}">Reservas</a>
            </div>
        </div>
    </nav>

    <div class="cover-container">
        <main class="px-3">
            
            <h1 class="display-4 fw-bold">Bienvenido a Zapacciano</h1>
            
            <p class="lead text-light-50">
                Vive una experiencia culinaria inolvidable.
                <br>
                Explora nuestro menú o reserva tu mesa.
            </p>
            
            <div class="d-grid gap-3 d-md-flex justify-content-md-center mt-5">
                
                <a th:href="@{/reservas}" class="btn btn-light btn-lg px-4 me-md-2">
                    <i class="bi bi-calendar-check-fill"></i> Hacer una Reserva
                </a>

                <a th:href="@{/menu}" class="btn btn-outline-light btn-lg px-4">
                    <i class="bi bi-book-fill"></i> Ver Menú
                </a>
                
                <a th:href="@{/login}" class="btn btn-outline-light btn-lg px-4 ms-md-2">
                    <i class="bi bi-person-badge-fill"></i> Soy Empleado
                </a>
            </div>
        </main>
    </div>

</body>
</html>
