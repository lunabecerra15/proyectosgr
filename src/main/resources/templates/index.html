<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a Zapacciano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h1 class="display-4">Bienvenido a Zapacciano</h1>
                        <p class="lead">El mejor lugar para disfrutar.</p>
                        <hr class="my-4">
                        
                        <div class="d-grid gap-3 d-md-flex justify-content-md-center">
                            <!-- Link al flujo de reserva -->
                            <a class="btn btn-primary btn-lg" th:href="@{/reservas}">
                                Hacer una Reserva
                            </a>
                            
                            <!-- Link al login de empleados (Mozo/Admin) -->
                            <a class="btn btn-outline-secondary btn-lg" th:href="@{/login}">
                                Acceso Empleados
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
